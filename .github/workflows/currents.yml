# Rebuilds the forecast packs four times a day and publishes them as GitHub release
# assets with fixed addresses the app downloads:
#   https://github.com/<you>/<repo>/releases/download/currents-latest/salishsea.ttcur   (currents, UBC SalishSeaCast)
#   .../currents-latest/ciops_west.ttcur (currents, ECCC CIOPS-West, BC coast and SE Alaska, 48 h)
#   .../currents-latest/regions.json plus <region>.ttwind/.ttrain/.ttcloud/.ttoutlook for each
#   west-coast region from San Diego to Kodiak (tools/regions/build_regions.py)
# Paste that address into Tiller Time › More › Currents › Pack address.
# Free on GitHub Actions; the repository must be public for the app to download without a login.
name: Build forecast packs

on:
  schedule:
    - cron: "17 2,8,14,20 * * *"   # UTC, four times a day
  workflow_dispatch: {}             # "Run workflow" button for a manual build
  push:                             # rebuild when the builder changes
    branches: [main]
    paths: ["tools/**", ".github/workflows/currents.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install numpy scipy eccodes netCDF4
      - name: Cache model grid
        uses: actions/cache@v4
        with:
          path: tools/currents/.cache
          key: ssc-grid-v21-08
      - name: Build current pack
        run: python tools/currents/build_current_pack.py -o salishsea.ttcur
      - name: Build wind, rain, cloud and outlook packs for every west-coast region
        run: python tools/regions/build_regions.py --out packs
      - name: Build tide pack
        run: python tools/tides/build_tide_pack.py -o salishsea.tides.json
      - name: Build CIOPS-West currents (BC coast and SE Alaska, 48 h)
        run: python tools/currents/build_ciops_pack.py -o ciops_west.ttcur
        continue-on-error: true
      - name: Build tidal current stations (10 days, NOAA + CHS)
        run: python tools/currents/build_current_stations.py -o currents_stations.json
        continue-on-error: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view currents-latest >/dev/null 2>&1 || \
            gh release create currents-latest --title "Current pack (latest)" \
              --notes "Forecast packs for Tiller Time, rebuilt automatically. Currents: SalishSeaCast, © SalishSeaCast Project Contributors and UBC, Apache-2.0. Wind and rain: contains information licensed under the Open Government Licence – Canada (ECCC HRDPS), and NOAA HRRR (public domain) in California and the Gulf of Alaska. Clouds and 10-day outlook: NOAA HRRR and GFS (public domain). Tides: NOAA CO-OPS and Canadian Hydrographic Service (Open Government Licence – Canada)."
          gh release upload currents-latest salishsea.ttcur salishsea.tides.json packs/* $(ls currents_stations.json ciops_west.ttcur 2>/dev/null) --clobber
