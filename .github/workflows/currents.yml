# Rebuilds the forecast packs four times a day and publishes them as GitHub release
# assets with fixed addresses the app downloads:
#   https://github.com/<you>/<repo>/releases/download/currents-latest/salishsea.ttcur   (currents, UBC SalishSeaCast)
#   https://github.com/<you>/<repo>/releases/download/currents-latest/salishsea.ttwind  (wind, ECCC HRDPS)
# Paste that address into Tiller Time › More › Currents › Pack address.
# Free on GitHub Actions; the repository must be public for the app to download without a login.
name: Build forecast packs

on:
  schedule:
    - cron: "17 2,8,14,20 * * *"   # UTC, four times a day
  workflow_dispatch: {}             # "Run workflow" button for a manual build
  push:                             # rebuild when the builder changes
    branches: [main]
    paths: ["tools/**", ".github/workflows/currents.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install numpy scipy eccodes
      - name: Cache model grid
        uses: actions/cache@v4
        with:
          path: tools/currents/.cache
          key: ssc-grid-v21-08
      - name: Build current pack
        run: python tools/currents/build_current_pack.py -o salishsea.ttcur
      - name: Build wind and rain packs
        run: python tools/wind/build_wind_pack.py -o salishsea.ttwind --rain-output salishsea.ttrain
      - name: Build cloud and 10-day outlook packs
        run: python tools/clouds/build_cloud_pack.py --clouds salishsea.ttcloud --outlook salishsea.ttoutlook
      - name: Build tide pack
        run: python tools/tides/build_tide_pack.py -o salishsea.tides.json
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view currents-latest >/dev/null 2>&1 || \
            gh release create currents-latest --title "Current pack (latest)" \
              --notes "Forecast packs for Tiller Time, rebuilt automatically. Currents: SalishSeaCast, © SalishSeaCast Project Contributors and UBC, Apache-2.0. Wind and rain: contains information licensed under the Open Government Licence – Canada (ECCC HRDPS). Clouds and 10-day outlook: NOAA HRRR and GFS (public domain). Tides: NOAA CO-OPS and Canadian Hydrographic Service (Open Government Licence – Canada)."
          gh release upload currents-latest salishsea.ttcur salishsea.ttwind salishsea.ttrain salishsea.tides.json salishsea.ttcloud salishsea.ttoutlook --clobber
