# Rebuilds the Tiller Time vector chart pack every week from NOAA's free electronic
# navigational charts (public domain) and publishes it next to the forecast packs:
#   https://github.com/<you>/<repo>/releases/download/currents-latest/charts_salish.ttenc
# Covers US waters of the Salish Sea: Puget Sound, the San Juans, Strait of Juan de Fuca.
name: Build vector charts

on:
  schedule:
    - cron: "41 9 * * 1"            # Mondays, UTC (NOAA publishes ENC updates weekly)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["tools/enc/**", ".github/workflows/charts.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install GDAL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin python3-gdal
      - name: Build chart pack
        run: /usr/bin/python3 tools/enc/build_enc_pack.py --work enc_cells --output charts_salish.ttenc
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view currents-latest >/dev/null 2>&1 || \
            gh release create currents-latest --title "Current pack (latest)" --notes "Packs for Tiller Time."
          gh release upload currents-latest charts_salish.ttenc --clobber
